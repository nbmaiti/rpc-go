# THROWAWAY POC workflow for validating the split release pipeline on a fork.
# DELETE THIS FILE before opening the upstream PR — it is not part of the release.
#
# Mirrors the real job graph in release.yml:
#
#   build -> sign-windows (signtool.exe on windows-latest) -> cosign+verify
#
# but with a fixed version, no semantic-release, no Docker, and no publish, so it
# is safe to push repeatedly to a fork (github.com/nbmaiti/rpc-go).
#
# What it proves:
#   1. Artifacts survive the upload/download round trip between runners.
#   2. sign-windows.ps1 finds signtool.exe and either signs or cleanly no-ops
#      (no-ops here unless you add the WINDOWS_PFX_* secrets to the fork).
#   3. Cosign signs the post-Authenticode bytes and verify-blob passes against
#      the exact files that would ship — the ordering bug this pipeline exists
#      to avoid.
#
# Add WINDOWS_PFX_BASE64 / WINDOWS_PFX_PASSWORD as fork secrets to exercise the
# real signing path; without them the sign step logs a skip and passes through.

name: TEST Release POC (fork only)

on:
  push:
    branches: [ cosign_bin, authenticode-signing, release-poc ]
  workflow_dispatch:

permissions:
  contents: read

env:
  POC_VERSION: 0.0.0-poc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.3.0
        with:
          go-version: 'stable'
          check-latest: true

      - name: Install go-licenses
        run: |
          go install github.com/google/go-licenses@v1.0.0
          echo "PATH=$PATH:$(go env GOPATH)/bin" >> $GITHUB_ENV

      - name: Build release binaries
        run: ./build.sh "$POC_VERSION"

      # Record the pre-signing digests so the verify job can prove the .exe
      # bytes actually changed (or deliberately did not) after Authenticode.
      - name: Record unsigned digests
        run: sha256sum rpc_windows_x64.exe rpc_windows_x86.exe | tee unsigned-exe-digests.txt

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: poc-artifacts-unsigned
          path: |
            rpc_linux_x64.tar.gz
            rpc_linux_x86.tar.gz
            rpc_windows_x64.exe
            rpc_windows_x86.exe
            rpc_so_x64.tar.gz
            licenses.zip
            unsigned-exe-digests.txt
          if-no-files-found: error
          retention-days: 1

  sign-windows:
    needs: build
    runs-on: windows-latest
    # Hoisted to job level so the `if:` below can test it: the env context is
    # reliably available in a step `if:`, the secrets context is not. Named
    # REAL_* rather than WINDOWS_* so it cannot collide with the WINDOWS_*
    # values the generate step writes via GITHUB_ENV — a name set in an `env:`
    # map would otherwise shadow the GITHUB_ENV one.
    env:
      REAL_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      REAL_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download unsigned artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: poc-artifacts-unsigned

      # No real certificate on the fork, so mint a throwaway self-signed one and
      # feed it in through the same env vars a real secret would use. This makes
      # the POC actually execute signtool.exe instead of taking the skip branch —
      # without it the run proves nothing about the signing path.
      #
      # The resulting signature is UNTRUSTED (the cert chains to nothing) and
      # does nothing for SmartScreen. It only proves the mechanics: signtool is
      # found, the .pfx round-trips through base64, the PE bytes change, and
      # Cosign signs the post-Authenticode bytes.
      #
      # Skipped when a real WINDOWS_PFX_BASE64 secret exists, so adding the
      # secret later switches this to the genuine cert with no edit here.
      - name: Generate throwaway self-signed cert (POC only)
        if: ${{ env.REAL_PFX_BASE64 == '' }}
        shell: pwsh
        run: |
          $pw = 'poc-' + [guid]::NewGuid().ToString('N')
          # -Type CodeSigningCert already sets the code-signing EKU and
          # DigitalSignature key usage; don't restate them and risk a parameter
          # conflict. -KeyExportPolicy Exportable is required by Export-PfxCertificate.
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=rpc-go POC Signing (UNTRUSTED, DO NOT SHIP)' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddDays(1)
          $pfx = Join-Path $env:RUNNER_TEMP 'poc-selfsigned.pfx'
          $null = Export-PfxCertificate -Cert $cert -FilePath $pfx `
            -Password (ConvertTo-SecureString -String $pw -Force -AsPlainText)
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfx))
          Remove-Item $pfx -Force
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force
          # ::add-mask:: keeps the throwaway key and password out of the log.
          Write-Host "::add-mask::$b64"
          Write-Host "::add-mask::$pw"
          "WINDOWS_PFX_BASE64=$b64" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_PFX_PASSWORD=$pw" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Generated throwaway self-signed code-signing cert."

      # A self-signed cert has no trusted RFC3161 timestamp authority problem —
      # public timestamp servers happily timestamp anything — so the real
      # timestamp URL is still exercised.
      - name: Authenticode-sign Windows binaries
        shell: pwsh
        env:
          # A real secret wins; otherwise fall back to the throwaway cert the
          # step above exported into GITHUB_ENV as WINDOWS_PFX_BASE64.
          WINDOWS_PFX_BASE64: ${{ env.REAL_PFX_BASE64 || env.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ env.REAL_PFX_PASSWORD || env.WINDOWS_PFX_PASSWORD }}
        run: ./sign-windows.ps1

      # Assert a signature is actually embedded. Status will be NotTrusted or
      # UnknownError for the self-signed POC cert — that is expected and fine.
      # NotSigned is the real failure: it means signtool silently did nothing.
      - name: Verify a signature is embedded
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in 'rpc_windows_x64.exe', 'rpc_windows_x86.exe') {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f -> $($sig.Status) | $($sig.SignerCertificate.Subject)"
            if ($sig.Status -eq 'NotSigned') {
              Write-Host "::error::$f has no Authenticode signature"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host 'Both executables carry an Authenticode signature.'

      - name: Upload signed Windows executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: poc-artifacts-windows-signed
          path: |
            rpc_windows_x64.exe
            rpc_windows_x86.exe
          if-no-files-found: error
          retention-days: 1

  cosign:
    needs: [build, sign-windows]
    permissions:
      contents: read
      id-token: write # for Cosign keyless signing (Fulcio/OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: 'v3.0.2'

      - name: Download unsigned artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: poc-artifacts-unsigned

      - name: Download signed Windows executables
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: poc-artifacts-windows-signed

      - name: Compare digests before and after Authenticode
        run: |
          set -euo pipefail
          echo "--- digests recorded before signing ---"
          cat unsigned-exe-digests.txt
          echo "--- digests of the files Cosign is about to sign ---"
          sha256sum rpc_windows_x64.exe rpc_windows_x86.exe
          # The sign job always signs (real cert or throwaway self-signed), so
          # unchanged bytes mean the signature never landed. Fail loudly —
          # silently passing here is how the Cosign ordering bug hides.
          if sha256sum -c --status unsigned-exe-digests.txt 2>/dev/null; then
            echo "::error::.exe bytes unchanged — Authenticode signing did not happen."
            exit 1
          fi
          echo "✅ .exe bytes changed — Cosign will sign the post-Authenticode bytes."

      - name: Sign binaries with Cosign
        run: ./sign.sh

      - name: Verify signatures (keyless)
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Keyless identity is this workflow file on this fork/branch.
          CERT_IDENTITY="https://github.com/${GH_REPO}/.github/workflows/test-release-poc.yml@refs/heads/.*"
          OIDC_ISSUER="https://token.actions.githubusercontent.com"
          for artifact in rpc_linux_x64.tar.gz rpc_linux_x86.tar.gz rpc_windows_x64.exe rpc_windows_x86.exe rpc_so_x64.tar.gz; do
            echo "🧾 Verifying $artifact"
            cosign verify-blob \
              --bundle "${artifact}.cosign.bundle.json" \
              --certificate-identity-regexp "$CERT_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              "$artifact"
          done
          echo "🟢 All signatures verified against the post-Authenticode bytes."

      - name: Upload release candidate for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: poc-release-candidate
          path: |
            rpc_linux_x64.tar.gz
            rpc_linux_x86.tar.gz
            rpc_windows_x64.exe
            rpc_windows_x86.exe
            rpc_so_x64.tar.gz
            licenses.zip
            *.sig
            *.pem
            *.cosign.bundle.json
          if-no-files-found: error
